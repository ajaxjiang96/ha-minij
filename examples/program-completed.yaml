alias: 小吉官方消息确认程序完成
triggers:
  - trigger: event.received
    target:
      entity_id: event.replace_with_your_minij_device_notification
    options:
      event_type:
        - wash_completed
        - cleaning_completed
actions:
  - action: persistent_notification.create
    data:
      notification_id: "{{ trigger.entity_id }}_completed"
      title: 小吉程序完成
      message: 小吉云端已发出程序完成消息，请查看机器及小吉 App。
mode: queued
max: 10
