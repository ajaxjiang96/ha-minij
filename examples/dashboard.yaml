# 单张手动卡片，先替换所有 replace_with_your_... 实体 ID；不是完整仪表盘配置。
# 原生 select 直接使用集成实时提供的选项，不在这里硬编码程序或参数值。
type: vertical-stack
cards:
  - type: entities
    title: 小吉洗衣机 · 当前运行
    show_header_toggle: false
    entities:
      - entity: sensor.replace_with_your_minij_status
        name: 状态
      - entity: sensor.replace_with_your_minij_reported_program
        name: 机器上报程序
      - entity: sensor.replace_with_your_minij_reported_process
        name: 机器上报阶段
      - entity: sensor.replace_with_your_minij_remaining_time
        name: 云端剩余时间
  - type: entities
    title: 待启动程序与参数
    show_header_toggle: false
    entities:
      - entity: select.replace_with_your_minij_program
        name: 待启动程序（本地草稿）
      - entity: select.replace_with_your_minij_water_level
        name: 水位
      - entity: select.replace_with_your_minij_temperature
        name: 温度
      - entity: select.replace_with_your_minij_rinse
        name: 漂洗
      - entity: select.replace_with_your_minij_drying
        name: 烘干
      - entity: select.replace_with_your_minij_drying_strength
        name: 烘干强度
      - entity: select.replace_with_your_minij_steam
        name: 蒸汽除菌
      - entity: select.replace_with_your_minij_uvc
        name: UVC 筒灯
  - type: grid
    columns: 3
    square: false
    cards:
      - type: button
        entity: button.replace_with_your_minij_wake
        name: 唤醒
        icon: mdi:power
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.replace_with_your_minij_wake
        hold_action:
          action: none
        double_tap_action:
          action: none
      - type: button
        entity: button.replace_with_your_minij_start_program
        name: 启动待选程序
        icon: mdi:play
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.replace_with_your_minij_start_program
          confirmation:
            text: 启动当前待选程序？请先核对程序和参数，确认机器已准备好。
        hold_action:
          action: none
        double_tap_action:
          action: none
      - type: button
        entity: button.replace_with_your_minij_pause
        name: 暂停
        icon: mdi:pause
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.replace_with_your_minij_pause
        hold_action:
          action: none
        double_tap_action:
          action: none
      - type: button
        entity: button.replace_with_your_minij_resume
        name: 继续
        icon: mdi:play-pause
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.replace_with_your_minij_resume
        hold_action:
          action: none
        double_tap_action:
          action: none
      - type: button
        entity: button.replace_with_your_minij_power_off
        name: 停止／关机
        icon: mdi:stop
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.replace_with_your_minij_power_off
          confirmation:
            text: 停止当前程序并关机？此操作可能中断洗涤。
        hold_action:
          action: none
        double_tap_action:
          action: none
      - type: button
        entity: button.replace_with_your_minij_start_cleaning
        name: 筒清洁
        icon: mdi:washing-machine
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.replace_with_your_minij_start_cleaning
          confirmation:
            text: 启动筒清洁？请先确认空筒并按机器要求准备。
        hold_action:
          action: none
        double_tap_action:
          action: none
  - type: entities
    title: 设备设置与通知
    show_header_toggle: false
    entities:
      - entity: switch.replace_with_your_minij_prompt_tone
        name: 提示音
      - entity: switch.replace_with_your_minij_child_lock
        name: 童锁（面板效果待验证）
      - entity: event.replace_with_your_minij_device_notification
        name: 最近一次官方消息
  - type: markdown
    content: >-
      程序选择是本地待启动草稿；**参数修改会立即提交到小吉云端**，不是等待启动才保存。
      切换程序后，参数允许值由集成更新；不支持的参数可能显示不可用。
      云端状态通常每 60 秒更新，命令接受不等于机器已执行，请勿因延迟反复点击。
      暂停或待机时剩余时间可为未知；最近消息时间不是精确结束时间。
