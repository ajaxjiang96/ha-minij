name: 型号支持反馈
description: 反馈其他小吉型号或固件的验证结果。
body:
  - type: input
    id: model
    attributes:
      label: 公开型号与内部 API 型号
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: 设备与 Wi-Fi 固件版本
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 集成与 Home Assistant 版本
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: 已观察的状态与行为
      description: >-
        说明哪些字段已与 App 或机器对照。安装成功不代表全部能力已验证。
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: 最小脱敏示例
      description: >-
        只提供相关状态字段，删除凭据、手机号、账号/设备 ID、序列号、网络信息和姓名。
        不上传原始账号响应或 APK。
      render: json
